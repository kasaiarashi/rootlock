version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rootlock-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rootlock
      POSTGRES_USER: rootlock
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootlock_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootlock"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rootlock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-rootlock_dev_redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rootlock-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://rootlock:${DB_PASSWORD:-rootlock_dev_password}@postgres:5432/rootlock?sslmode=disable
      REDIS_URL: redis://default:${REDIS_PASSWORD:-rootlock_dev_redis}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      SERVER_PORT: 8080
      ENV: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:1420
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: rootlock-network
